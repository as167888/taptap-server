<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapTap推荐广告跟踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
 body { font-family:'Microsoft YaHei',sans-serif; background:#f0f2f5; margin:0; padding:30px 16px; }
 h1 { text-align:center; font-size:24px; color:#1a1a1a; margin:0 0 6px; }
 .sub { text-align:center; color:#666; font-size:.88em; margin-bottom:22px; }
 .box { background:#fff; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.06); max-width:1100px; margin:0 auto 16px; padding:16px; }
 .ttl { font-size:15px; color:#2f3542; margin:4px 0 8px 8px; font-weight:bold; }
 .desc { font-size:12.5px; color:#7a7a7a; line-height:1.75; margin:0 8px 10px; }
 .c1 { width:100%; height:330px; }
 .note { color:#888; font-size:12.5px; max-width:1100px; margin:0 auto; line-height:1.8; }
</style></head><body>
<h1>TapTap推荐广告跟踪</h1>

<div class="box">
 <div class="ttl">① 广告曝光比例指数</div>
 <div class="desc">每隔一段时间，抓取 TapTap 的【推荐】页面下，前 100 个游戏卡页。根据游戏卡页中，广告卡页的占比，测算得到广告曝光比例指数。</div>
 <div id="c1" class="c1">图表需联网加载 ECharts</div>
</div>

<div class="box">
 <div class="ttl">② 【推荐】页面的CPM指数</div>
 <div id="c2" class="c1">图表需联网加载 ECharts</div>
</div>

<div class="note">说明：纵轴为指数（首期=1），仅用于比较趋势强弱，不含绝对数值；横轴为观测时间。</div>
<script>
const D = {"labels": ["09-15 23:56", "09-16 00:42", "09-16 01:10", "09-16 03:10", "09-16 04:09", "09-16 05:09", "09-16 06:10", "09-16 07:10", "09-16 08:10", "09-16 09:13", "09-16 10:10", "09-16 11:10", "09-16 12:10", "09-16 13:10", "09-16 14:10", "09-16 15:10", "09-16 16:10", "09-16 17:10", "09-16 18:10", "09-16 19:10", "09-16 20:10", "09-16 21:10", "09-16 22:10", "09-16 23:10", "09-17 00:10", "09-17 01:10", "09-17 02:10", "09-17 03:10", "09-17 04:10", "09-17 05:10", "09-17 06:10", "09-17 07:10", "09-17 08:10"], "ratio": [1.0, 1.118, 1.235, 1.118, 1.0, 1.294, 1.588, 1.706, 1.765, 1.706, 1.706, 1.588, 1.588, 1.588, 1.588, 1.412, 1.588, 1.412, 1.412, 1.412, 1.353, 1.471, 0.647, 0.294, 1.529, 1.118, 0.882, 0.471, 0.353, 0.412, 0.235, 0.235, 0.412], "cpm": [1.0, 2.604, 10.463, 3.576, 15.21, 13.617, 13.734, 13.931, 55.484, 28.133, 3.942, 6.298, 4.169, 27.674, 5.442, 17.428, 2.578, 2.924, 3.606, 3.904, 2.218, 2.987, 34.777, 13.168, 4.406, 5.123, 5.213, 5.212, 4.112, 1.562, 4.109, 1.501, 17.445]};
function mk(el, name, data, color){
  if (typeof echarts === 'undefined') { document.getElementById(el).textContent='⚠ 图表需要联网加载 ECharts。'; return; }
  echarts.init(document.getElementById(el)).setOption({
    tooltip:{trigger:'axis', formatter:p=>{
      const x=p[0];
      return '<b>'+x.axisValue+'</b><br>'+name+'：'+(x.value==null?'—':x.value)+' 倍（首期=1）';}},
    grid:{left:84,right:40,bottom:60,top:52,containLabel:true},
    xAxis:{type:'category',data:D.labels,axisLabel:{fontSize:10.5,rotate:45}},
    yAxis:{type:'value',name:'指数（首期=1）',
      nameLocation:'end',nameGap:18,
      nameTextStyle:{fontSize:12,align:'left',padding:[0,0,0,-8]},
      axisLabel:{fontSize:11.5}},
    series:[{name:name,type:'line',data:data,symbolSize:7,smooth:true,
      lineStyle:{width:3,color:color},itemStyle:{color:color},
      label:{show:true,position:'top',fontSize:9.5,formatter:p=>p.value},
      areaStyle:{color:color+'1a'},connectNulls:true}]
  });
}
mk('c1','广告曝光比例', D.ratio, '#00a8ff');
mk('c2','【推荐】页面的CPM', D.cpm, '#e67e22');
</script></body></html>
